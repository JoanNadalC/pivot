<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pivot. Nouveau mot de passe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --vert:    #1C3A2A;
      --vert-md: #2D5940;
      --vert-lt: #3E7A58;
      --ecru:    #F5F0E8;
      --cuivre:  #B87333;
      --blanc:   #FAFAF7;
      --gris:    #6B7280;
      --gris-lt: #E8E4DC;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--vert); color: var(--vert); }
    .page { display: flex; min-height: 100vh; }

    .left {
      flex: 1; background: var(--vert); padding: 48px 52px;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
    }
    .left-glow { position: absolute; bottom: -100px; right: -80px; width: 420px; height: 420px; background: radial-gradient(circle, rgba(62,122,88,0.3) 0%, transparent 70%); pointer-events: none; }
    .left-glow2 { position: absolute; top: -60px; left: -60px; width: 280px; height: 280px; background: radial-gradient(circle, rgba(184,115,51,0.07) 0%, transparent 70%); pointer-events: none; }
    .grid-lines { position: absolute; inset: 0; background-image: linear-gradient(rgba(245,240,232,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(245,240,232,0.03) 1px, transparent 1px); background-size: 32px 32px; pointer-events: none; }
    .logo-row { display: flex; align-items: baseline; position: relative; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: var(--ecru); letter-spacing: -0.02em; }
    .logo-dot { color: var(--cuivre); }
    .logo-racine { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 400; font-style: italic; color: rgba(245,240,232,0.35); margin-left: 7px; }
    .headline { margin-top: 20px; position: relative; }
    .headline h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 2.8vw, 2.4rem); font-weight: 900; color: var(--ecru); line-height: 1.15; letter-spacing: -0.02em; }
    .headline h1 em { font-style: italic; color: var(--cuivre); }
    .headline p { font-size: 0.9rem; color: rgba(245,240,232,0.5); margin-top: 14px; line-height: 1.75; max-width: 340px; }
    .left-footer { position: relative; padding-top: 24px; border-top: 0.5px solid rgba(245,240,232,0.08); display: flex; justify-content: space-between; align-items: center; }
    .left-footer span { font-size: 0.68rem; color: rgba(245,240,232,0.18); letter-spacing: 0.04em; }

    .right { flex: 0 0 360px; background: var(--blanc); padding: 48px 36px; display: flex; flex-direction: column; justify-content: center; border-left: 0.5px solid var(--gris-lt); }
    .right-header { margin-bottom: 28px; }
    .right-header h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--vert); margin-bottom: 5px; letter-spacing: -0.01em; }
    .right-header p { font-size: 0.82rem; color: var(--gris); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #9CA3AF; margin-bottom: 6px; }
    .field input { width: 100%; background: #fff; border: 0.5px solid var(--gris-lt); border-radius: 4px; padding: 11px 14px; font-size: 0.88rem; font-family: 'Inter', sans-serif; color: var(--vert); outline: none; transition: border-color 0.15s; }
    .field input:focus { border-color: var(--vert-md); }
    .field input::placeholder { color: #D1D5DB; }
    .error-msg { display: none; font-size: 0.78rem; color: #B91C1C; background: #FEF2F2; border: 0.5px solid #FECACA; border-radius: 4px; padding: 9px 12px; margin-bottom: 14px; }
    .error-msg.visible { display: block; }
    .success-msg { display: none; font-size: 0.82rem; color: #166534; background: #F0FDF4; border: 0.5px solid #BBF7D0; border-radius: 4px; padding: 12px; margin-bottom: 14px; }
    .success-msg.visible { display: block; }
    .btn-main { width: 100%; background: var(--vert); border: none; border-radius: 4px; padding: 12px 16px; font-size: 0.88rem; font-weight: 600; font-family: 'Inter', sans-serif; color: var(--ecru); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
    .btn-main:hover { background: var(--vert-md); }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-footer { margin-top: 24px; text-align: center; }
    .form-footer a { font-size: 0.75rem; color: var(--cuivre); text-decoration: none; }
    .form-footer a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .page { flex-direction: column; }
      .left { padding: 36px 28px 40px; flex: none; }
      .headline h1 { font-size: 1.7rem; }
      .right { flex: none; border-left: none; border-top: 0.5px solid var(--gris-lt); padding: 36px 28px; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="left">
    <div class="grid-lines"></div>
    <div class="left-glow"></div>
    <div class="left-glow2"></div>
    <div class="logo-row">
      <span class="logo-text">Pivot<span class="logo-dot">.</span><span class="logo-racine">la racine</span></span>
    </div>
    <div>
      <div class="headline" id="left-headline">
        <h1>Réinitialisation<br>de votre <em>mot de passe.</em></h1>
        <p>Choisissez un nouveau mot de passe sécurisé pour accéder à votre portail Pivot.</p>
      </div>
    </div>
    <div class="left-footer">
      <span>© 2025 Pivot La Racine</span>
      <span>Sécurisé · Chiffré</span>
    </div>
  </div>

  <div class="right">
    <div class="right-header" id="right-header">
      <h2>Nouveau mot de passe</h2>
      <p>Saisissez et confirmez votre nouveau mot de passe.</p>
    </div>

    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>

    <div id="loading-msg" style="font-size:0.82rem;color:var(--gris);text-align:center;padding:16px 0;">Vérification du lien…</div>

    <div id="form-wrap" style="display:none;">
      <div class="field">
        <label>Nouveau mot de passe</label>
        <div style="position:relative;">
          <input type="password" id="password" placeholder="8 caractères minimum" autocomplete="new-password" style="padding-right:40px;">
          <button type="button" onclick="togglePwd('password',this)" tabindex="-1" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:#9CA3AF;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <div style="position:relative;">
          <input type="password" id="password2" placeholder="Répétez le mot de passe" autocomplete="new-password" style="padding-right:40px;">
          <button type="button" onclick="togglePwd('password2',this)" tabindex="-1" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:#9CA3AF;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn-main" id="btn-submit" onclick="submitReset()">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Enregistrer le mot de passe
      </button>
    </div>

    <div class="form-footer">
      <a href="/index.html">← Retour à l'accueil</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://djegdtlcvyjtrayrodxj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqZWdkdGxjdnlqdHJheXJvZHhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjkxNjcsImV4cCI6MjA5NjYwNTE2N30.PF-BR0Q02aczjIvZ6dIUbsn3hGJtQjHtjegQ5k-qI3s';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Supabase v2 intercepte automatiquement le hash — on écoute l'événement PASSWORD_RECOVERY
  let sessionReady = false;

  function markReady() {
    sessionReady = true;
    document.getElementById('loading-msg').style.display = 'none';
    // Adapter les textes si mode=creation (détecté au moment où la session est prête)
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'creation') {
      document.getElementById('left-headline').innerHTML = '<h1>Bienvenue sur<br><em>Pivot La Racine.</em></h1><p>Dernière étape — choisissez un mot de passe pour accéder à votre espace.</p>';
      document.getElementById('right-header').innerHTML = '<h2>Créez votre mot de passe</h2><p>Choisissez un mot de passe pour sécuriser votre compte.</p>';
    }
    document.getElementById('form-wrap').style.display = 'block';
    document.getElementById('error-msg').classList.remove('visible');
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && !sessionReady)) {
      markReady();
    }
  });

  async function init() {
    // Cas moderne : lien Supabase avec token_hash + type dans la query string
    // (format utilisé par les templates d'email récents — ni hash ni ?code=)
    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get('token_hash') || params.get('token');
    const otpType = params.get('type') || 'recovery';
    if (tokenHash) {
      const { error } = await db.auth.verifyOtp({ token_hash: tokenHash, type: otpType });
      if (!error) { markReady(); return; }
      document.getElementById('loading-msg').style.display = 'none';
      showError('Lien invalide ou expiré. Demandez un nouveau lien depuis la page de connexion.');
      return;
    }

    // Cas code PKCE explicite dans l'URL
    const code = params.get('code');
    if (code) {
      const { error } = await db.auth.exchangeCodeForSession(code);
      if (!error) { markReady(); return; }
      document.getElementById('loading-msg').style.display = 'none';
      showError('Lien invalide ou expiré. Demandez un nouveau lien depuis la page de connexion.');
      return;
    }

    // Laisser jusqu'à 4s à Supabase pour traiter le hash (#access_token=...) avant de déclarer l'échec
    for (let i = 0; i < 8; i++) {
      if (sessionReady) return;
      await new Promise(r => setTimeout(r, 500));
    }
    if (sessionReady) return;

    // Dernier recours : une session existe déjà ?
    const { data: { session } } = await db.auth.getSession();
    if (session) { markReady(); return; }

    document.getElementById('loading-msg').style.display = 'none';
    showError('Aucun token trouvé dans l\'URL. Demandez un nouveau lien depuis la page de connexion.');
  }

  function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.style.color = show ? 'var(--vert)' : '#9CA3AF';
  }

  async function submitReset() {
    const pwd = document.getElementById('password').value;
    const pwd2 = document.getElementById('password2').value;

    if (pwd.length < 8) return showError('Le mot de passe doit contenir au moins 8 caractères.');
    if (pwd !== pwd2) return showError('Les mots de passe ne correspondent pas.');

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Enregistrement…';

    const { error } = await db.auth.updateUser({ password: pwd });

    if (error) {
      showError(error.message);
      btn.disabled = false;
      btn.textContent = 'Enregistrer le mot de passe';
    } else {
      document.getElementById('form-wrap').style.display = 'none';
      showSuccess('Mot de passe mis à jour. Redirection…');
      try {
        const { data: { user } } = await db.auth.getUser();
        const role = user?.user_metadata?.role || user?.app_metadata?.role;
        const portails = { fournisseur: 'pivot-fournisseur.html', moe: 'pivot-moe.html', entreprise: 'pivot-entrepreneur.html' };
        let dest = portails[role];
        // Les collaborateurs photos n'ont pas de rôle dans leurs métadonnées auth
        // (créés via generate_link sans "role") : on les détecte via la table collaborateurs.
        if (!dest) {
          const { data: collab } = await db.from('collaborateurs').select('id').eq('auth_user_id', user.id).maybeSingle();
          if (collab) dest = 'pivot-app-photos.html';
        }
        setTimeout(() => { window.location.href = dest || 'index.html'; }, 2000);
      } catch { setTimeout(() => { window.location.href = 'index.html'; }, 2000); }
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function showSuccess(msg) {
    const el = document.getElementById('success-msg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  init();
</script>
</body>
</html>
